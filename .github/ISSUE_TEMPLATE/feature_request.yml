name: Feature request
description: Suggest something ASTra should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What did you do instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ASTra to do?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which part?
      options:
        - Command line (astra)
        - MCP server
        - Engine (library)
        - Documentation
    validations:
      required: true
