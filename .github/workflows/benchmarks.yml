name: Benchmarks

# Reusable benchmark runner. Lives on a bench/** branch (this one is bench/runner); never touches main or a release.
#
# What it measures
#   baseline: the PUBLISHED package pinned in benchmarks/package.json (skip with baseline = none)
#   build:    a local build of ANY branch, tag or commit of this repository (target_ref)
#
# How the work is split (each job is its own GitHub-hosted VM, so jobs cannot load each other)
#   measure: one job per (variant x experiment group), all in parallel. Counts and pass/fail results
#            (E1 locality, E4 atomicity, E5 history) do not depend on the machine, so parallel runners are safe.
#   perf:    ONE dedicated job for the timing experiments (E6/E7). Baseline and build run back to back on the
#            SAME VM, alternating (baseline, build, baseline, build), so the comparison is not distorted by
#            differences between VMs. Nothing else runs on that VM.
#
# How to run it (see benchmarks/CI.md)
#   - Edit benchmarks/bench.config.json (target_ref, baseline, experiments), commit, push to a bench/** branch.
#   - Or dispatch by hand and override any field: gh workflow run benchmarks.yml --ref bench/runner -f target_ref=<ref>

on:
  push:
    branches: ['bench/**']
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or commit to build and measure (default: from bench.config.json)'
        type: string
        default: ''
      baseline:
        description: 'published = also run the pinned published package; none = skip it'
        type: choice
        options: ['', published, none]
        default: ''
      experiments:
        description: 'Space-separated: e1 e1_oracles e1_control e4 e5 e5_orphans e6 (e6 also runs e7)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Read configuration
    runs-on: ubuntu-latest
    outputs:
      target_ref: ${{ steps.cfg.outputs.target_ref }}
      baseline_version: ${{ steps.cfg.outputs.baseline_version }}
      matrix: ${{ steps.cfg.outputs.matrix }}
      has_measure: ${{ steps.cfg.outputs.has_measure }}
      has_perf: ${{ steps.cfg.outputs.has_perf }}
      with_baseline: ${{ steps.cfg.outputs.with_baseline }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        env:
          IN_TARGET: ${{ inputs.target_ref }}
          IN_BASELINE: ${{ inputs.baseline }}
          IN_EXPERIMENTS: ${{ inputs.experiments }}
        run: |
          cfg=benchmarks/bench.config.json
          pick() { local v="$1" k="$2"; if [ -n "$v" ]; then echo "$v"; else jq -r ".$k" "$cfg"; fi; }
          target=$(pick "$IN_TARGET" target_ref)
          baseline=$(pick "$IN_BASELINE" baseline)
          experiments=$(pick "$IN_EXPERIMENTS" experiments)
          pinned=$(jq -r '.dependencies["@attentionform/astra-mcp-server"]' benchmarks/package.json)
          exps=$(echo "$experiments" | jq -R 'split(" ") | map(select(length > 0))')
          if [ "$baseline" = "published" ]; then variants='["baseline","build"]'; else variants='["build"]'; fi
          matrix=$(jq -nc --argjson exps "$exps" --argjson variants "$variants" '
            {e1: ["e1","e1_oracles","e1_control"], e4: ["e4"], e5: ["e5","e5_orphans"]} as $g
            | {include: [ $variants[] as $v | ($g | to_entries[]) as $e
                | ($e.value | map(select(. as $s | $exps | index($s)))) as $steps
                | select(($steps | length) > 0)
                | {variant: $v, group: $e.key, steps: ($steps | join(" "))} ]}')
          has_measure=$(echo "$matrix" | jq '.include | length > 0')
          has_perf=$(echo "$exps" | jq 'index("e6") != null')
          {
            echo "target_ref=$target"
            echo "baseline_version=$pinned"
            echo "matrix=$matrix"
            echo "has_measure=$has_measure"
            echo "has_perf=$has_perf"
            echo "with_baseline=$([ "$baseline" = "published" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "target_ref=$target baseline=$baseline ($pinned) experiments=$experiments"
            echo "$matrix" | jq -r '.include[] | "- \(.variant) / \(.group): \(.steps)"'
            echo "perf (E6/E7, same VM, alternating): $has_perf"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  measure:
    name: ${{ matrix.variant }} / ${{ matrix.group }}
    needs: config
    if: ${{ needs.config.outputs.has_measure == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    env:
      EXPERIMENTS: ${{ matrix.steps }}
      ORACLE_WORKERS: '4'
    steps:
      # The harness always comes from this (bench) branch; the code under test comes from target_ref.
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        if: ${{ matrix.variant == 'build' }}
        with:
          ref: ${{ needs.config.outputs.target_ref }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools (LibreOffice, Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pip
          pip install --break-system-packages python-docx lxml Pillow
      - name: Name the build
        id: label
        run: |
          if [ "${{ matrix.variant }}" = "build" ]; then
            cd target
            version=$(jq -r .version packages/mcp-server/package.json)
            sha=$(git rev-parse --short=7 HEAD)
            echo "label=${version}-build-${sha}" >> "$GITHUB_OUTPUT"
            echo "git_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ needs.config.outputs.baseline_version }}-hosted-runner" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the packages of the target ref
        if: ${{ matrix.variant == 'build' }}
        working-directory: target
        run: |
          npm install -g npm@^11
          npm ci
          npm run build:packages
      - name: Install the harness dependencies (the published package under test, for the baseline)
        working-directory: harness/benchmarks
        run: npm ci
      - name: Point the harness at the build or at the published package
        run: |
          echo "BENCH_LABEL=${{ steps.label.outputs.label }}" >> "$GITHUB_ENV"
          if [ "${{ matrix.variant }}" = "build" ]; then
            echo "ASTRA_SERVER_BIN=$GITHUB_WORKSPACE/target/packages/mcp-server/dist/index.js" >> "$GITHUB_ENV"
            echo "GITHUB_SHA_UNDER_TEST=${{ steps.label.outputs.git_head }}" >> "$GITHUB_ENV"
          fi
      - name: Generate the corpus
        working-directory: harness/benchmarks
        run: python3 corpus/generate.py
      - name: Record the environment
        working-directory: harness/benchmarks
        run: node run/env.mjs > /dev/null
      - name: Run the experiments of this group, one at a time
        working-directory: harness/benchmarks
        run: bash ../.github/scripts/run-benchmarks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.variant }}-${{ matrix.group }}-${{ steps.label.outputs.label }}
          path: harness/benchmarks/results/${{ steps.label.outputs.label }}
          if-no-files-found: warn

  perf:
    name: perf (E6/E7, baseline and build alternating on one VM)
    needs: config
    if: ${{ needs.config.outputs.has_perf == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WITH_BASELINE: ${{ needs.config.outputs.with_baseline }}
      BASELINE_VERSION: ${{ needs.config.outputs.baseline_version }}
      PERF_ROUNDS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.target_ref }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools (LibreOffice, Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pip
          pip install --break-system-packages python-docx lxml Pillow
      - name: Name the build
        id: label
        working-directory: target
        run: |
          version=$(jq -r .version packages/mcp-server/package.json)
          sha=$(git rev-parse --short=7 HEAD)
          echo "BUILD_LABEL=${version}-build-${sha}" >> "$GITHUB_ENV"
          echo "GITHUB_SHA_UNDER_TEST=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build the packages of the target ref
        working-directory: target
        run: |
          npm install -g npm@^11
          npm ci
          npm run build:packages
      - name: Install the harness dependencies
        working-directory: harness/benchmarks
        run: npm ci
      - name: Generate the corpus
        working-directory: harness/benchmarks
        run: python3 corpus/generate.py
      - name: Run E6/E7 alternating, alone on this VM
        working-directory: harness/benchmarks
        env:
          TARGET_SERVER_BIN: ${{ github.workspace }}/target/packages/mcp-server/dist/index.js
        run: bash ../.github/scripts/run-perf-ab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-perf
          path: harness/benchmarks/results/perf-*
          if-no-files-found: warn
