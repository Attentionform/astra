name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Upgrade npm (lockfile v3 optional-platform fix)
      run: npm install -g npm@^11

    - name: Install dependencies
      run: npm ci

    - name: Build monorepo packages
      run: npm run build:packages

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.403'
        cache: true
        cache-dependency-path: packages/ooxml-validator/native/packages.lock.json

    - name: Build native validator binary
      run: npm run build:native --workspace=@attentionform/ooxml-validator

    - name: Schema freshness gate (regenerate-and-diff)
      run: npm run gen:schemas && git diff --exit-code -- schemas/mcp

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Lint (errors fail the build)
      run: npx eslint . --quiet

    - name: Install LibreOffice & Poppler (headless export dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils

    - name: Run unit tests
      run: npx vitest run

    - name: Validate OOXML documents
      run: npm run validate:docs

  # The packed CLI and MCP server, installed globally and run through the shims npm writes, on Linux,
  # macOS and Windows (x64 and arm64). See platform-smoke.yml.
  platform-smoke:
    name: Platform smoke
    permissions:
      contents: read
    uses: ./.github/workflows/platform-smoke.yml

  # A real render, no mocks: LibreOffice and Poppler installed the way a user installs them, then a
  # page image (PNG) and a PDF export from the built engine, on each operating system. The unit tests
  # inject the platform rules; this job proves them on the real machines. LibreOffice for Windows and
  # macOS does not put itself on PATH, so this also covers the install-folder lookup.
  visual-render:
    name: Visual render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@^11
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: npm run build:native --workspace=@attentionform/ooxml-validator
      - name: Build the engine
        run: |
          npm run build --workspace=@attentionform/ooxml-validator
          npm run build --workspace=@attentionform/astra-engine
      - name: Install LibreOffice and Poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - name: Install LibreOffice and Poppler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask libreoffice
          brew install poppler
      - name: Install LibreOffice and Poppler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install libreoffice-fresh poppler -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show what the machine has
        shell: bash
        run: |
          echo "soffice on PATH:  $(command -v soffice || echo none)"
          echo "pdftoppm on PATH: $(command -v pdftoppm || echo none)"
          case "$RUNNER_OS" in
            Linux)   dpkg -l libreoffice-writer poppler-utils | grep '^ii' ;;
            macOS)   ls -d /Applications/LibreOffice.app && brew list --versions poppler ;;
            Windows) choco list --local-only libreoffice-fresh poppler
                     ls "/c/Program Files/LibreOffice/program/soffice.exe" ;;
          esac
      - name: Render a page and export a PDF
        run: node scripts/visual-render-smoke.mjs

  original-recovery-filesystem:
    name: Original recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@^11
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: npm run build:native --workspace=@attentionform/ooxml-validator
      - name: Build packages used by subprocess recovery tests
        run: |
          npm run build --workspace=@attentionform/ooxml-validator
          npm run build --workspace=@attentionform/astra-engine
      - name: Verify exclusive capture, export, restore and atomic replacement
        run: npx vitest run tests/unit/original-recovery.test.ts tests/unit/original-restore-engine.test.ts
      - name: Verify Windows locked-target restore and retry
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/fixtures/windows-locked-restore.ps1
