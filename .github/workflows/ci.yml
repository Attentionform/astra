name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-research:
    name: Directory publication research (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run directory publication experiment
        run: node scripts/lock-publication-fs-spike.cjs
      - name: Run exclusive manifest experiment
        run: node scripts/lock-manifest-spike.cjs
      - run: npm install -g npm@^11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isomorphic-git relocation experiment
        env:
          ASTRA_RESEARCH_ROOT: ${{ github.workspace }}
        run: node scripts/lock-git-relocation-spike.cjs
