name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Upgrade npm (lockfile v3 optional-platform fix)
      run: npm install -g npm@^11

    - name: Install dependencies
      run: npm ci

    - name: Build monorepo packages
      run: npm run build:packages

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.403'
        cache: true
        cache-dependency-path: packages/ooxml-validator/native/packages.lock.json

    - name: Build native validator binary
      run: npm run build:native --workspace=@attentionform/ooxml-validator

    - name: Schema freshness gate (regenerate-and-diff)
      run: npm run gen:schemas && git diff --exit-code -- schemas/mcp

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Lint (errors fail the build)
      run: npx eslint . --quiet

    - name: Install LibreOffice & Poppler (headless export dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils

    - name: Run unit tests
      run: npx vitest run

    - name: Validate OOXML documents
      run: npm run validate:docs

  # The packed CLI and MCP server, installed globally and run through the shims npm writes, on Linux,
  # macOS and Windows (x64 and arm64). See platform-smoke.yml.
  platform-smoke:
    name: Platform smoke
    permissions:
      contents: read
    uses: ./.github/workflows/platform-smoke.yml

  original-recovery-filesystem:
    name: Original recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install -g npm@^11
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - run: npm run build:native --workspace=@attentionform/ooxml-validator
      - name: Build packages used by subprocess recovery tests
        run: |
          npm run build --workspace=@attentionform/ooxml-validator
          npm run build --workspace=@attentionform/astra-engine
      - name: Verify exclusive capture, export and atomic replacement
        run: npx vitest run tests/unit/original-recovery.test.ts
      - name: Verify Windows locked-target restore and retry
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/fixtures/windows-locked-restore.ps1
