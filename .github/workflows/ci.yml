name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-research:
    name: Directory publication research (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run filesystem research
        run: node scripts/lock-publication-fs-spike.cjs
